[project]
name = "autotasker-backend"
version = "0.1.0"
description = "AutoTasker backend — FastAPI + LangGraph Meta-Agent and Worker orchestrator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AutoTasker" }]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",

  # LangGraph + LangChain core (modern API only)
  "langgraph>=0.2.50",
  "langgraph-checkpoint-postgres>=2.0.0",
  "langchain-core>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "langchain-openai>=0.2.0",

  # Persistence + auth
  "supabase>=2.9.0",
  "psycopg[binary,pool]>=3.2.0",

  # Background execution
  "inngest>=0.4.0",

  # Web automation (worker tools)
  "httpx>=0.27.0",

  # Observability / utils
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotasker_backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
